name: Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['*.md']
    branches: ['main']
  push:
    paths-ignore: ['*.md']
    branches: ['main']
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # Build each arch independently: a slow/failing aarch64 emulated build
      # must not prevent the proven x86_64 .s9pk from shipping.
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make buildah fuse-overlayfs slirp4netns uidmap squashfs-tools squashfs-tools-ng jq

      # aarch64 images are built on the amd64 runner via QEMU emulation.
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Configure Docker Buildx
        run: |
          docker buildx create --name startos-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Configure container registries
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          printf 'unqualified-search-registries = ["docker.io"]\n' | sudo tee /etc/containers/registries.conf.d/99-dockerio.conf

      - name: Install Start CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          url="$(curl -fsSL 'https://api.github.com/repos/Start9Labs/start-technologies/releases?per_page=20' \
            | jq -r '[.[] | select(.tag_name | startswith("start-cli/")) | .assets[] | select(.name == "start-cli_x86_64-linux") | .browser_download_url][0] // empty')"
          if [ -z "$url" ]; then
            echo "Unable to find start-cli_x86_64-linux in Start9Labs/start-technologies start-cli releases" >&2
            exit 1
          fi
          curl -fsSL "$url" -o "$HOME/.local/bin/start-cli"
          chmod +x "$HOME/.local/bin/start-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialize StartOS developer key
        run: start-cli init-key

      - name: Initialize StartOS packaging workspace
        run: start-cli s9pk init-workspace ..

      - name: Build package (${{ matrix.arch }})
        run: make ${{ matrix.arch }}

      # Best-effort: a private repo's free-tier Actions artifact storage (500 MB)
      # is easily exceeded; don't let a storage-quota hit fail the build. The
      # durable delivery path is the GitHub Release below.
      - name: Upload .s9pk artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openwhispr-${{ matrix.arch }}-s9pk
          path: '*.s9pk'
          if-no-files-found: warn

      # Publish the arch's .s9pk to a GitHub Release (not subject to the artifact
      # storage quota). Both matrix jobs target the same tag; `create || true`
      # tolerates the create race, and the two jobs upload distinctly-named files.
      - name: Publish .s9pk to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S9PK="$(ls *.s9pk | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(start-cli s9pk inspect "$S9PK" manifest | jq -r .version | cut -d: -f1)"
            TAG="v${VERSION}"
          fi
          echo "Publishing $S9PK to release $TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" "$S9PK" --clobber
